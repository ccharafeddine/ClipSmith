[package]
name = "clipsmith"
version = "2.2.3"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clipsmith_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
# URL import. native-tls uses the OS TLS stack (Secure Transport on macOS,
# schannel on Windows): no aws-lc-sys C build, no extra disk. Used for the
# direct-media-link download path; everything else goes through the yt-dlp sidecar.
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
# select!/sleep to race a download against a cancel flag so a stalled URL fetch
# can be aborted promptly. tokio is already in the tree via tauri.
tokio = { version = "1", features = ["time", "macros"] }
# Subject-aware auto-reframe (v2 Tier 2): pure-Rust ONNX inference for the
# bundled face/person detectors. tract compiles into the binary — no native
# ONNX Runtime lib to bundle per platform. MIT/Apache-2.0, GPL-3.0-compatible.
tract-onnx = "0.23"
# URL-import scrape fallback: pull video/HLS/DASH links out of page HTML.
# Already in the tree transitively; MIT/Apache-2.0.
regex = "1"
# Shared URL download engine (yt-dlp, scraper, sniff mode, cookies), from the
# MediaSmith repo so all Smith apps share one implementation.
smith-fetch = { git = "https://github.com/ccharafeddine/media-smith", rev = "e63ba081dcdece723acc74dcaad842de9d0bba38", features = ["tauri"] }

[dev-dependencies]
# Runtime for the #[ignore]d live download harness in commands.rs tests.
tokio = { version = "1", features = ["rt", "time", "macros"] }
